apiVersion: 1

# Conexion a Postgres (Neon) por variables de entorno del proceso de Grafana.
# En Render / HF Spaces:  PG_SSLMODE=require
datasources:
  - name: PostgreSQL Abastecimiento
    type: postgres
    uid: abastecimiento_bi          # el dashboard referencia este uid
    access: proxy
    url: ${PG_HOST}:${PG_PORT}
    database: ${PG_DATABASE}
    user: ${PG_USER}
    isDefault: true
    editable: false
    jsonData:
      sslmode: ${PG_SSLMODE}
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${PG_PASSWORD}
